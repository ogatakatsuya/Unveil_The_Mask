[project]
name = "unveil-the-mask-video"
version = "0.1.0"
description = "Video branch: inter-frame differencing model trained from scratch"
requires-python = ">=3.12,<3.13"
dependencies = [
  "blosc2>=3.7,<4",
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.9,<5",
  "torch==2.5.1+cu121",
  "tqdm>=4.67,<5",
]

[dependency-groups]
dev = ["pytest>=8.4,<9"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".venv", "data", "output"]
pythonpath = ["."]
